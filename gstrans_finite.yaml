# Opaque 3D room and nearby props give the background multi-view parallax.
# Unlike gstrans_dataset.yaml, this configuration needs no HDR files/indexes.
Project: GSTransDataset
project_name: gstrans_finite
output_folder: ./result

ior_range: [1.3, 1.6]
envnum_per_shape: 1              # independent camera/IOR sampling per mesh
camnum_per_env: 16

TransparentGS:
  background_mode: finite
  seed: 0
  heldout_views: 4
  object_init_bounds: [-1.3, -1.3, -1.3, 1.3, 1.3, 1.3]
  background_init_bounds: [-3.6, -3.6, -1.15, 3.6, 3.6, 3.4]
  init_count: 100000

Tracer:
  backend: mitsuba

Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply  # Replaced from the first shape index at runtime.
      IoR: 1.5
    - type: constant_environment_light
      intensity: 0.15           # Interior area light is built in GSTransDataset.py.

Camera:
  type: perspective
  fov: 80
  sampler:
    type: independent
    sample_count: 512
  film:
    type: hdrfilm
    width: 512
    height: 512
    rfilter:
      type: tent
    pixel_format: rgb

CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [45, 105]
  r_range: [1.8, 2.2]
  shift: [0, 0, 0]
